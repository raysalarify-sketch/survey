const STORAGE_KEY = "worked-survey-v2";
const storage = {
  async get() { try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : []; } catch { return []; } },
  async save(data) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; } catch { return false; } },
  async add(entry) { const d = await this.get(); d.push(entry); return this.save(d); },
  async post(entry) {
    // 서버 API가 설정된 경우 서버로 전송
    if (API_URL) {
      try { await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(entry) }); } catch(e) { console.error("API 전송 실패:",e); }
    }
    return this.add(entry);
  }
};

function App() {
  const [step,setStep] = React.useState("company");
  const [company,setCompany] = React.useState("");
  const [selectedServices,setSelectedServices] = React.useState([]);
  const [answers,setAnswers] = React.useState({});
  const [currentTab,setCurrentTab] = React.useState(0);
  const [animating,setAnimating] = React.useState(false);
  const [direction,setDirection] = React.useState("next");
  const [view,setView] = React.useState("main");
  const [responses,setResponses] = React.useState([]);
  const [pinInput,setPinInput] = React.useState("");
  const [pinError,setPinError] = React.useState(false);

  const loadResponses = async()=>{setResponses(await storage.get())};
  React.useEffect(()=>{loadResponses()},[]);

  const tabs = [...selectedServices.map(sid=>SERVICES.find(s=>s.id===sid)),{id:"overall",name:"종합 의견",icon:"📊"}];
  const currentTabData = tabs[currentTab];
  const currentQuestions = currentTabData?.id==="overall"?OVERALL_QUESTIONS:(SERVICE_QUESTIONS[currentTabData?.id]||[]);
  const allQuestions = []; selectedServices.forEach(sid=>{if(SERVICE_QUESTIONS[sid]) allQuestions.push(...SERVICE_QUESTIONS[sid]);}); allQuestions.push(...OVERALL_QUESTIONS);
  const totalRating = allQuestions.filter(q=>q.type==="rating").length;
  const answeredRating = allQuestions.filter(q=>q.type==="rating"&&answers[q.id]>0).length;
  const canProceed = currentQuestions.filter(q=>q.type==="rating").every(q=>answers[q.id]>0);
  const setAnswer = (id,val) => setAnswers(prev=>({...prev,[id]:val}));
  const navigate = dir => {setDirection(dir);setAnimating(true);setTimeout(()=>{setCurrentTab(t=>dir==="next"?t+1:t-1);setAnimating(false)},200)};
  const toggleService = sid => setSelectedServices(prev=>prev.includes(sid)?prev.filter(s=>s!==sid):[...prev,sid]);

  const handleSubmit = async()=>{
    const entry={...answers,_company:company,_services:selectedServices,submittedAt:new Date().toISOString()};
    await storage.post(entry);
    setStep("submitted");
  };
